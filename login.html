<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Iniciar Sesión | DevSolutions</title>
        <link rel="stylesheet" href="css/styles.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    </head>
    <body>
        
    <div class="contenedor-formulario">
        <h1>Iniciar Sesión</h1>
        <p class="subtitulo">Ingresa tus datos para acceder al sistema.</p>

        <!-- El atributo novalidate deshabilita las alertas flotantes nativas del navegador -->
        <form class="formulario" id="formLogin" novalidate>
            <!-- Grupo 1: Correo -->
            <div class="grupo-formulario">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="usuario@ejemplo.com">
                <span id="error-email" class="mensaje-error">Error: El formato del correo electrónico no es válido.</span>
            </div>

            <!-- Grupo 2: Contraseña -->
            <div class="grupo-formulario">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Mínimo 8 caracteres, mayúscula, número y símbolo">
                <span id="error-password" class="mensaje-error">Error: La contraseña debe tener al menos 8 caracteres, una mayúscula, una minúscula, un número y un carácter especial.</span>
            </div>

            <button type="submit" class="boton-enviar">Ingresar</button>
            <a href="index.html" class="enlace-navegacion"> Ir a index</a>
        </form>
    </div>

    <!-- Enlace de la librería de utilería y el script de validación -->
    <script src="js/utileria.js"></script>
    <script>
        const formLogin = document.getElementById('formLogin');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorEmail = document.getElementById('error-email');
        const errorPassword = document.getElementById('error-password');
        
        formLogin.addEventListener('submit', function(e) {
            e.preventDefault(); // Evitar recarga automática

            const correoInput = emailInput.value;
            const passwordInputVal = passwordInput.value;

            // Validar usando las funciones de la librería utileria.js
            const correoValido = validarCorreo(correoInput);
            const passwordValido = validarPassword(passwordInputVal);

            let hayError = false;

            // Validar correo
            if (!correoValido) {
                emailInput.classList.add('error');
                errorEmail.classList.add('activo'); // Muestra etiqueta de error personalizada
                hayError = true;
            } else {
                emailInput.classList.remove('error');
                errorEmail.classList.remove('activo');
            }

            // Validar contraseña
            if (!passwordValido) {
                passwordInput.classList.add('error');
                errorPassword.classList.add('activo'); // Muestra etiqueta de error personalizada
                hayError = true;
            } else {
                passwordInput.classList.remove('error');
                errorPassword.classList.remove('activo');
            }

            // Si hay error, detener aquí
            if (hayError) {
                return;
            }

            // Si todo es correcto
            alert("¡Inicio de sesión exitoso!");
            formLogin.reset();
            emailInput.classList.remove('error');
            passwordInput.classList.remove('error');
            errorEmail.classList.remove('activo');
            errorPassword.classList.remove('activo');
        });
    </script>

    </body>
</html>
